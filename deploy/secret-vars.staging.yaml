# Secrets for the staging environment. Name it anything -- it's just a label,
# whatever this secret is already called in Secrets Manager. What matters is
# the description: the agent reads it to figure out what the secret is for
# and how to wire it.
environment: staging

# Optional: override the agent-wide defaults for this app/environment.
# Leave out any key (or the whole block) to keep using the agent's own
# defaults -- see instructions/secrets-flow.md for the full list of keys.
# Each key can be a literal value, or `{secret_id: /its/own/path}` to fetch
# it from its own individually-named Secrets Manager secret.
# infra:
#   aws_region:
#     secret_id: /apps/staging/APP_NAME/aws_region
#   eks_cluster_name: my-eks-cluster

secrets:
  - name: EXAMPLE_SECRET
    description: "Replace this with a real secret this app needs in staging, then delete this line."
